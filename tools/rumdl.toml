# SPDX-License-Identifier: Apache-2.0
[global]
enable = ["ALL"]
disable = ["MD013", "MD063", "MD082", "MD093"]
respect-gitignore = false
editorconfig = true
flavor = "standard"

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD009]
strict = true

[MD010]
code-blocks = true
spaces-per-tab = 4

[MD033]
allowed-elements = ["a"]

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "asterisk"

[MD050]
style = "asterisk"

[MD055]
style = "leading-and-trailing"

[MD060]
enabled = true
style = "compact"
