# SPDX-License-Identifier: Apache-2.0
[project]
name = "velalang-tools"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["filelock==4.2.5", "jsonschema==4.26.0", "markdown-it-py==4.2.0"]

[dependency-groups]
dev = [
    "charset-normalizer==3.5.2",
    "reuse==6.3.0",
    "ruff==0.17.3",
    "rumdl==0.3.2; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "ty==0.0.97",
]
workflows = ["zizmor==1.31.1"]

[tool.uv]
package = false
required-version = "==0.13.6"
python-downloads = "never"
no-build = true
# The release cooldown; tools/README.md gives the policy.
exclude-newer = "3 days"
