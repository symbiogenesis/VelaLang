# SPDX-License-Identifier: Apache-2.0
# Stock runners check Python and Markdown without the native proof toolchain.

name: static

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-markdown:
    name: Python and Markdown (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the project's Python minor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: tools/pyproject.toml

      - name: Install the project's pinned uv
        shell: python
        run: |
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("tools/pyproject.toml").read_text(encoding="utf-8"))
          requirement = "uv" + project["tool"]["uv"]["required-version"]
          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check",
                          "--only-binary=:all:", requirement], check=True)

      - name: Check Python and Markdown
        run: python tools/run.py validate --static
